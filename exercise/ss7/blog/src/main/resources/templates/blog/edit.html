<form th:action="@{/blog/update}" th:object="${blog}" method="post">

    <input type="hidden" th:field="*{id}"/>

    <div class="form-group">
        <label>Title</label>
        <input type="text" th:field="*{title}" placeholder="Enter blog title">
    </div>

    <div class="form-group">
        <label>Content</label>
        <textarea th:field="*{content}" rows="6"
                  placeholder="Enter blog content"></textarea>
    </div>
    <div class="form-group">
        <label>Author</label>
        <input type="text" th:field="*{author}" placeholder="Enter your name">
    </div>
    <div class="form-group">
        <label>Published Date</label>
        <input type="date" th:field="*{publishedDate}">
    </div>
    <div class="form-group">
        <label>Category</label>
        <select name="category.id">
            <option value="">-- Select Category --</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}">
            </option>
        </select>
    </div>
    <button type="submit">Update</button>
</form>
