<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Detail</title>
  <link rel="stylesheet" th:href="@{/layout/style.css}">
</head>
<body>

<div class="container">
  <a class="back-link" href="/blog">← Back to home</a>

  <div class="blog-detail-card">
    <h1 class="blog-title" th:text="${blog.title}"></h1>

    <div class="blog-meta">
      <span>✍ Author: <b th:text="${blog.author}"></b></span>
      <span>📅 Date: <b th:text="${blog.publishedDate}"></b></span>
      <span>🏷 Category: <p th:text="${blog.category?.name}"></p></span>
    </div>

    <hr>

    <p class="blog-content" th:text="${blog.content}"></p>

    <div class="action-buttons">
      <a class="btn delete"
         th:href="@{/blog/delete/{id}(id=${blog.id})}"
         onclick="return confirm('Are you sure?')">
        Delete
      </a>

      <a class="btn edit"
         th:href="@{/blog/edit/{id}(id=${blog.id})}">
        Edit
      </a>
    </div>
  </div>
</div>

</body>
</html>
