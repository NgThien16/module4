<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/layout/style.css}">
</head>
<body>
<h1>Blogs</h1>
<a href="blog/add">Add New Blog</a>
<a href="category">Category Management</a><br>
<form action="/blog">
    <input name="searchTitle" th:value="${searchTitle}">
    <button>Search by Title</button>
</form>
<div class="blog-card" th:each="blog : ${blogPage.content}">
    <div class="blog-content">
        <h3 class="blog-title" th:text="${blog.title}"></h3>
        <p class="blog-desc" th:text="${blog.content}"></p>
        <a href="blog/detail">detail</a>
    </div>
</div>
<a th:if="${blogPage.hasPrevious()}" th:href="@{/blog(page=${blogPage.number -1},searchTitle=${searchTitle})}">Previous</a>
<span th:text="${blogPage.number +1}"></span>/<span th:text="${blogPage.totalPages}"></span>
<a th:if="${blogPage.hasNext()}" th:href="@{/blog(page=${blogPage.number +1},searchTitle=${searchTitle})}">Next</a>
<p class="success-msg" th:if="${mess}" th:text="${mess}"></p>
</body>
</html>
