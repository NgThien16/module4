<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS (nếu có) -->
    <link rel="stylesheet" th:href="@{/layout/style.css}">
</head>
<body class="bg-light">

<div class="container my-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📚 Blog List</h2>
        <div>
            <a th:href="@{/blog/add}" class="btn btn-success btn-sm">➕ Add Blog</a>
            <a th:href="@{/category}" class="btn btn-secondary btn-sm">📂 Category</a>
        </div>
    </div>

    <!-- Search -->
    <form class="row g-2 mb-4" th:action="@{/blog}" method="get">
        <div class="col-md-10">
            <input class="form-control"
                   id="searchTitle"
                   name="searchTitle"
                   placeholder="Search by title..."
                   th:value="${searchTitle}">
        </div>
        <div class="col-md-2">
            <button type="button" class="btn btn-primary w-100">Search</button>
        </div>
    </form>

    <!-- Blog Cards -->
    <div class="row" id="blogList" th:fragment="blogList">
        <div class="col-md-4 mb-4" th:each="blog : ${blogPage.content}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${blog.title}"></h5>
                    <p class="card-text text-muted text-truncate"
                       th:text="${blog.content}"></p>

                    <div class="mt-auto">
                        <a th:href="@{/blog/detail/{id}(id=${blog.id})}"
                           class="btn btn-outline-primary btn-sm">
                            View Detail
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="text-center mt-3">
        <button id="loadMore" class="btn btn-outline-primary">
            ⬇ Load more
        </button>
    </div>


    <!-- Message -->
    <div class="alert alert-success mt-3"
         th:if="${mess}"
         th:text="${mess}">
    </div>

</div>

</body>
</html>
<script>
    $("#btnSearch").click(function () {
        let searchTitle = $("#searchTitle").val();

        $.ajax({
            url: "/blog/search",
            type: "GET",
            data: {
                searchTitle: searchTitle
            },
            success: function (data) {
                $("#blogList").html(data);
                page = 0; // reset page khi search
            }
        });
    });
</script>
<script>
    let page = 0;

    $("#loadMore").click(function () {
        page++;

        $.ajax({
            url: "/blog/load-more",
            type: "GET",
            data: {
                page: page,
                searchTitle: $("#searchTitle").val()
            },
            success: function (data) {
                if (data.trim() === "") {
                    $("#loadMore").hide();
                } else {
                    $("#blogList").append(data);
                }
            }
        });
    });
</script>
