<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS (nếu có) -->
    <link rel="stylesheet" th:href="@{/layout/style.css}">
</head>
<body class="bg-light">

<div class="container my-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📚 Blog List</h2>
        <div>
            <a th:href="@{/blog/add}" class="btn btn-success btn-sm">➕ Add Blog</a>
            <a th:href="@{/category}" class="btn btn-secondary btn-sm">📂 Category</a>
        </div>
    </div>

    <!-- Search -->
    <form class="row g-2 mb-4" th:action="@{/blog}" method="get">
        <div class="col-md-10">
            <input class="form-control"
                   name="searchTitle"
                   placeholder="Search by title..."
                   th:value="${searchTitle}">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100">Search</button>
        </div>
    </form>

    <!-- Blog Cards -->
    <div class="row">
        <div class="col-md-4 mb-4" th:each="blog : ${blogPage.content}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${blog.title}"></h5>
                    <p class="card-text text-muted text-truncate"
                       th:text="${blog.content}"></p>

                    <div class="mt-auto">
                        <a th:href="@{/blog/detail/{id}(id=${blog.id})}"
                           class="btn btn-outline-primary btn-sm">
                            View Detail
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav class="d-flex justify-content-center mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!blogPage.hasPrevious()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/blog(page=${blogPage.number - 1}, searchTitle=${searchTitle})}">
                    Previous
                </a>
            </li>

            <li class="page-item disabled">
                <span class="page-link">
                    <span th:text="${blogPage.number + 1}"></span> /
                    <span th:text="${blogPage.totalPages}"></span>
                </span>
            </li>

            <li class="page-item" th:classappend="${!blogPage.hasNext()} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/blog(page=${blogPage.number + 1}, searchTitle=${searchTitle})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>

    <!-- Message -->
    <div class="alert alert-success mt-3"
         th:if="${mess}"
         th:text="${mess}">
    </div>

</div>

</body>
</html>
