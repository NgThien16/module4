<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/layout/style.css}">
</head>
<body>
<h1>Category Management</h1>
<a href="category/add">Add new category</a>
<table>
    <tr>
        <th>No. </th>
        <th>Name</th>
        <th>Action</th>
    </tr>
    <tr th:each="category,status : ${categoryList}">
        <td th:text="${status.count}"></td>
        <td th:text="${category.name}"></td>
        <td>
            <a th:href="@{/category/delete/{id}(id=${category.id})}"
               onclick="return confirm('Are you sure?')">
                Delete
            </a>
            <a th:href="@{/category/edit/{id}(id=${category.id})}">
                Edit
            </a>
        </td>
    </tr>
</table>

<p class="success-msg" th:if="${mess}" th:text="${mess}"></p>
</body>
</html>
