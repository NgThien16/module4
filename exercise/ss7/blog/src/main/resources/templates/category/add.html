<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Blog</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/layout/style.css}">
</head>
<body>

<div class="form-container">
    <h2>Add New Category</h2>

    <form th:action="@{/category/add}" th:object="${category}" method="post">

        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}" placeholder="Enter category name">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-save">Save</button>
            <a th:href="@{/category}" class="btn-cancel">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
