<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thư viện sách</title>
</head>
<body>
<h2>Danh sách sách</h2>

<table border="1">
    <tr>
        <th>Tên</th>
        <th>Tác giả</th>
        <th>Số lượng</th>
        <th>Thao tác</th>
    </tr>

    <tr th:each="book : ${books}">
        <td th:text="${book.name}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.quantity}"></td>
        <td>
            <a th:href="@{/books/{id}(id=${book.id})}">Xem</a>
        </td>
    </tr>
</table>

<br>
<a th:href="@{/books/return}">Trả sách</a>
</body>
</html>
