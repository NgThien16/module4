<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Danh sách sinh viên</title>
  <th:block th:insert="~{/layout/layout::library}"/>
</head>
<body>

<div th:replace="~{/layout/layout::my-navbar}"></div>

<h1>Danh sách sinh viên</h1>

<a class="btn btn-success btn-sm" th:href="@{/students/add}">Thêm mới</a>

<table class="table table-dark table-striped">
  <tr>
    <th>STT</th>
    <th>ID</th>
    <th>Name</th>
    <th>Detail-requestParam</th>
    <th>Detail-pathVariable</th>
  </tr>

  <!-- HIỂN THỊ LIST -->
  <tr th:each="student, status : ${studentList}">
    <td th:text="${status.count}"></td>
    <td th:text="${student.id}"></td>
    <td th:text="${student.name}"></td>
    <td>
      <a th:href="@{/students/detail(id=${student.id})}">
        Detail-RequestParam
      </a>
    </td>
    <td>
      <a th:href="@{/students/{id}/detail(id=${student.id})}">
        Detail-PathVariable
      </a>
    </td>
  </tr>

  <!-- LIST RỖNG -->
  <tr th:if="${#lists.isEmpty(studentList)}">
    <td colspan="5">Danh sách trống</td>
  </tr>
</table>

</body>
</html>
